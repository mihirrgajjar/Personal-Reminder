<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Reminder</title>
  <meta name="description" content="Personal Reminder website.">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
      <div class="auth-logo" aria-hidden="true" style="margin: 0 auto 1rem;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div>
      <h1 class="auth-title">Personal Reminder</h1>
      <p class="auth-subtitle" style="margin-top: 0.5rem;" id="routing-status">Verifying session...</p>
      <div class="loading-state" style="padding: 1.5rem 0;">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.example.js"></script>
  <script src="assets/js/config.js" onerror="/* optional config */"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script>
    (async function() {
      // If configured, inspect session
      if (window.SupabaseModule && window.SupabaseModule.isConfigured()) {
        try {
          const session = await window.SupabaseModule.getSession();
          if (session && session.user) {
            window.location.replace('dashboard.html');
            return;
          }
        } catch (e) {
          console.warn('Session check failed:', e);
        }
        window.location.replace('login.html');
      } else {
        // Fallback for unconfigured demo
        window.location.replace('dashboard.html');
      }
    })();
  </script>
</body>
</html>
