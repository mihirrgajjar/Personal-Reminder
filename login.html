<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login - Personal Reminder</title>
  <meta name="description" content="Private owner access for Personal Reminder website.">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo" aria-hidden="true">
          <!-- Bell Icon SVG -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <h1 class="auth-title" id="auth-title">Owner Sign In</h1>
        <p class="auth-subtitle" id="auth-subtitle">Private reminder portal. Enter your credentials to continue.</p>
      </div>

      <!-- Alert notifications -->
      <div id="auth-alert" class="alert hidden" role="alert">
        <svg id="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="alert-message"></span>
      </div>

      <!-- Sign In Form -->
      <form id="login-form" novalidate>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label" for="login-email">Owner Email <span class="required">*</span></label>
          <input 
            type="email" 
            id="login-email" 
            class="form-input" 
            placeholder="owner@gmail.com" 
            required 
            autocomplete="email"
          >
          <div class="form-error-msg hidden" id="login-email-error"></div>
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="login-password">Password <span class="required">*</span></label>
            <button type="button" id="btn-toggle-reset" class="btn-outline btn-sm" style="border:none; padding:0; font-size: 0.8rem; color: var(--primary);">
              Forgot password?
            </button>
          </div>
          <input 
            type="password" 
            id="login-password" 
            class="form-input" 
            placeholder="••••••••••••" 
            required 
            autocomplete="current-password"
          >
          <div class="form-error-msg hidden" id="login-password-error"></div>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%;">
          <span id="login-spinner" class="spinner hidden" style="width: 16px; height: 16px; border-width: 2px;"></span>
          <span id="login-btn-text">Sign In</span>
        </button>
      </form>

      <!-- Password Reset Form (Initially hidden) -->
      <form id="reset-form" class="hidden" novalidate>
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" for="reset-email">Owner Email <span class="required">*</span></label>
          <input 
            type="email" 
            id="reset-email" 
            class="form-input" 
            placeholder="owner@gmail.com" 
            required
          >
          <div class="form-error-msg hidden" id="reset-email-error"></div>
        </div>

        <div style="display: flex; gap: 0.75rem;">
          <button type="button" id="btn-cancel-reset" class="btn btn-secondary" style="flex: 1;">
            Back to Sign In
          </button>
          <button type="submit" id="btn-reset-submit" class="btn btn-primary" style="flex: 1;">
            <span id="reset-spinner" class="spinner hidden" style="width: 16px; height: 16px; border-width: 2px;"></span>
            <span id="reset-btn-text">Send Reset Link</span>
          </button>
        </div>
      </form>

      <div class="auth-footer">
        <p>Private single-user instance. Public registration is disabled.</p>
        <p style="margin-top: 0.5rem;">
          <a href="dashboard.html" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: underline;">
            Preview Phase 1 Demo Dashboard &rarr;
          </a>
        </p>
      </div>
    </div>
  </div>

  <script src="assets/js/config.example.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
